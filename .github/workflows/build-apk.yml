name: Build Blackpage APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Optional default API Base URL (e.g. https://your-server.com)"
        required: false
        type: string
        default: "https://blackpage-eta.vercel.app"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Inject API_BASE into index.html
        run: |
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("public/index.html", "utf8");
            const script = `<script>window.TOOLS_OP_API_BASE = ${JSON.stringify(process.env.API_BASE)};</script>`;
            html = html.replace("</head>", `  ${script}\n</head>`);
            fs.writeFileSync("public/index.html", html);
          '
        env:
          API_BASE: ${{ inputs.api_base || 'https://blackpage-eta.vercel.app' }}

      - name: Install Capacitor & Plugins
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/filesystem@6
          npm install --no-save @capacitor/assets sharp

      - name: Generate Android App Icon & Splash from logo.png
        run: |
          node -e '
            const fs = require("fs");
            const sharp = require("sharp");
            (async () => {
              fs.mkdirSync("assets", { recursive: true });
              await sharp("public/logo.png").resize(1024, 1024, { fit: "cover" }).png().toFile("assets/icon-only.png");
              await sharp("public/logo.png").resize(720, 720, { fit: "contain", background: { r: 0, g: 0, b: 0, alpha: 0 } })
                .extend({ top: 152, bottom: 152, left: 152, right: 152, background: { r: 0, g: 0, b: 0, alpha: 0 } })
                .png().toFile("assets/icon-foreground.png");
              await sharp({ create: { width: 1024, height: 1024, channels: 4, background: "#000000" } })
                .png().toFile("assets/icon-background.png");
              const centerBuf = await sharp("public/logo.png").resize(680, 680, { fit: "contain" }).png().toBuffer();
              await sharp({ create: { width: 2732, height: 2732, channels: 4, background: "#000000" } })
                .composite([{ input: centerBuf, gravity: "center" }])
                .png().toFile("assets/splash.png");
            })();
          '

      - name: Generate Android Project & Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#000000" --splashBackgroundColor "#000000"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const sharp = require("sharp");
            (async () => {
              const densities = [
                ["mipmap-mdpi", 48, 108],
                ["mipmap-hdpi", 72, 162],
                ["mipmap-xhdpi", 96, 216],
                ["mipmap-xxhdpi", 144, 324],
                ["mipmap-xxxhdpi", 192, 432]
              ];
              for (const [dir, iconSize, fgSize] of densities) {
                const outDir = path.join("android/app/src/main/res", dir);
                fs.mkdirSync(outDir, { recursive: true });
                const iconBuf = await sharp("public/logo.png").resize(iconSize, iconSize, { fit: "cover" }).png().toBuffer();
                const inner = Math.round(fgSize * 0.72);
                const pad = Math.floor((fgSize - inner) / 2);
                const fgBuf = await sharp("public/logo.png")
                  .resize(inner, inner, { fit: "contain", background: "#000000" })
                  .extend({ top: pad, bottom: fgSize - inner - pad, left: pad, right: fgSize - inner - pad, background: "#000000" })
                  .png().toBuffer();
                fs.writeFileSync(path.join(outDir, "ic_launcher.png"), iconBuf);
                fs.writeFileSync(path.join(outDir, "ic_launcher_round.png"), iconBuf);
                fs.writeFileSync(path.join(outDir, "ic_launcher_foreground.png"), fgBuf);
              }
              const bgXmlPath = "android/app/src/main/res/values/ic_launcher_background.xml";
              fs.mkdirSync(path.dirname(bgXmlPath), { recursive: true });
              fs.writeFileSync(bgXmlPath, `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#000000</color>\n</resources>\n`);
            })();
          '
          npx cap sync android

      - name: Patch AndroidManifest.xml permissions & cleartext
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace("<application", `<application android:usesCleartextTraffic="true"`);
            }
            const perms = [
              `<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />`,
              `<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />`,
              `<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />`,
              `<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />`
            ].filter(line => !xml.includes(line)).join("\n    ");
            if (perms) {
              xml = xml.replace("</manifest>", `    ${perms}\n</manifest>`);
            }
            fs.writeFileSync(p, xml);

            // Add Android system bar (Navigation Bar + Status Bar) theme bridge
            const maPath = "android/app/src/main/java/com/blackpage/app/MainActivity.java";
            if (fs.existsSync(maPath)) {
              const maCode = [
                "package com.blackpage.app;",
                "",
                "import android.graphics.Color;",
                "import android.os.Bundle;",
                "import android.webkit.JavascriptInterface;",
                "import androidx.core.view.WindowInsetsControllerCompat;",
                "import com.getcapacitor.BridgeActivity;",
                "",
                "public class MainActivity extends BridgeActivity {",
                "  @Override",
                "  protected void onCreate(Bundle savedInstanceState) {",
                "    super.onCreate(savedInstanceState);",
                "    if (this.bridge != null && this.bridge.getWebView() != null) {",
                "      this.bridge.getWebView().addJavascriptInterface(new Object() {",
                "        @JavascriptInterface",
                "        public void setSystemBarsDark(boolean isDark) {",
                "          runOnUiThread(() -> {",
                "            int bg = Color.parseColor(isDark ? \"#121214\" : \"#F2EDE2\");",
                "            getWindow().setStatusBarColor(bg);",
                "            getWindow().setNavigationBarColor(bg);",
                "            WindowInsetsControllerCompat ctrl = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());",
                "            ctrl.setAppearanceLightStatusBars(!isDark);",
                "            ctrl.setAppearanceLightNavigationBars(!isDark);",
                "          });",
                "        }",
                "      }, \"BlackpageNative\");",
                "    }",
                "  }",
                "}",
                ""
              ].join("\n");
              fs.writeFileSync(maPath, maCode);
            }
          '

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackpage-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Blackpage.apk & Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Blackpage.apk

      - name: Release APK on GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Blackpage.apk
          generate_release_notes: true
