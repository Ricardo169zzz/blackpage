name: Build Blackpage APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Optional default API Base URL (e.g. https://your-server.com)"
        required: false
        type: string
        default: "https://blackpage-eta.vercel.app"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Inject API_BASE into index.html
        run: |
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("public/index.html", "utf8");
            const script = `<script>window.TOOLS_OP_API_BASE = ${JSON.stringify(process.env.API_BASE)};</script>`;
            html = html.replace("</head>", `  ${script}\n</head>`);
            fs.writeFileSync("public/index.html", html);
          '
        env:
          API_BASE: ${{ inputs.api_base || 'https://blackpage-eta.vercel.app' }}

      - name: Install Capacitor & Plugins
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/filesystem@6
          npm install --no-save @capacitor/assets sharp

      - name: Generate Android App Icon & Splash from logo.png
        run: |
          node -e '
            const fs = require("fs");
            const sharp = require("sharp");
            (async () => {
              fs.mkdirSync("assets", { recursive: true });
              await sharp("public/logo.png").resize(1024, 1024, { fit: "cover" }).png().toFile("assets/icon-only.png");
              await sharp("public/logo.png").resize(720, 720, { fit: "contain", background: { r: 0, g: 0, b: 0, alpha: 0 } })
                .extend({ top: 152, bottom: 152, left: 152, right: 152, background: { r: 0, g: 0, b: 0, alpha: 0 } })
                .png().toFile("assets/icon-foreground.png");
              await sharp({ create: { width: 1024, height: 1024, channels: 4, background: "#000000" } })
                .png().toFile("assets/icon-background.png");
              const centerBuf = await sharp("public/logo.png").resize(680, 680, { fit: "contain" }).png().toBuffer();
              await sharp({ create: { width: 2732, height: 2732, channels: 4, background: "#000000" } })
                .composite([{ input: centerBuf, gravity: "center" }])
                .png().toFile("assets/splash.png");
            })();
          '

      - name: Generate Android Project & Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#000000" --splashBackgroundColor "#000000"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const sharp = require("sharp");
            (async () => {
              const densities = [
                ["mipmap-mdpi", 48, 108],
                ["mipmap-hdpi", 72, 162],
                ["mipmap-xhdpi", 96, 216],
                ["mipmap-xxhdpi", 144, 324],
                ["mipmap-xxxhdpi", 192, 432]
              ];
              for (const [dir, iconSize, fgSize] of densities) {
                const outDir = path.join("android/app/src/main/res", dir);
                fs.mkdirSync(outDir, { recursive: true });
                const iconBuf = await sharp("public/logo.png").resize(iconSize, iconSize, { fit: "cover" }).png().toBuffer();
                const inner = Math.round(fgSize * 0.72);
                const pad = Math.floor((fgSize - inner) / 2);
                const fgBuf = await sharp("public/logo.png")
                  .resize(inner, inner, { fit: "contain", background: "#000000" })
                  .extend({ top: pad, bottom: fgSize - inner - pad, left: pad, right: fgSize - inner - pad, background: "#000000" })
                  .png().toBuffer();
                fs.writeFileSync(path.join(outDir, "ic_launcher.png"), iconBuf);
                fs.writeFileSync(path.join(outDir, "ic_launcher_round.png"), iconBuf);
                fs.writeFileSync(path.join(outDir, "ic_launcher_foreground.png"), fgBuf);
              }
              const bgXmlPath = "android/app/src/main/res/values/ic_launcher_background.xml";
              fs.mkdirSync(path.dirname(bgXmlPath), { recursive: true });
              fs.writeFileSync(bgXmlPath, `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#000000</color>\n</resources>\n`);

              // Generate monochrome white-on-transparent small icon for Android notification banner
              const statDir = "android/app/src/main/res/drawable";
              fs.mkdirSync(statDir, { recursive: true });
              const rawLogo = await sharp("public/logo.png").resize(96, 96, { fit: "contain", background: { r: 0, g: 0, b: 0, alpha: 0 } }).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
              const { data, info } = rawLogo;
              for (let i = 0; i < data.length; i += 4) {
                const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                const alpha = data[i + 3];
                if (alpha > 30 && lum > 80) {
                  data[i] = 255; data[i + 1] = 255; data[i + 2] = 255; data[i + 3] = 255;
                } else {
                  data[i] = 255; data[i + 1] = 255; data[i + 2] = 255; data[i + 3] = 0;
                }
              }
              await sharp(data, { raw: { width: info.width, height: info.height, channels: 4 } }).png().toFile(path.join(statDir, "ic_stat_blackpage.png"));
            })();
          '
          npx cap sync android

      - name: Patch AndroidManifest.xml permissions & cleartext
        run: |
          node << 'EOF'
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace("<application", `<application android:usesCleartextTraffic="true"`);
            }
            const perms = [
              `<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />`,
              `<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />`,
              `<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />`,
              `<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />`,
              `<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />`,
              `<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />`,
              `<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />`,
              `<uses-permission android:name="android.permission.WAKE_LOCK" />`,
              `<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />`
            ].filter(line => !xml.includes(line)).join("\n    ");
            if (perms) {
              xml = xml.replace("</manifest>", `    ${perms}\n</manifest>`);
            }
            if (!xml.includes("com.blackpage.app.MusicService") && !xml.includes(`android:name=".MusicService"`)) {
              xml = xml.replace("</application>", `    <service android:name=".MusicService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>`);
            }
            fs.writeFileSync(p, xml);

            // Add MusicService.java (Foreground Service + Custom Blackpage Notification)
            const svcPath = "android/app/src/main/java/com/blackpage/app/MusicService.java";
            const svcCode = [
              "package com.blackpage.app;",
              "",
              "import android.app.Notification;",
              "import android.app.NotificationChannel;",
              "import android.app.NotificationManager;",
              "import android.app.PendingIntent;",
              "import android.app.Service;",
              "import android.content.Intent;",
              "import android.content.pm.ServiceInfo;",
              "import android.graphics.BitmapFactory;",
              "import android.media.session.MediaSession;",
              "import android.os.Build;",
              "import android.os.IBinder;",
              "",
              "public class MusicService extends Service {",
              "  public static final String CHANNEL_ID = \"blackpage_music_channel\";",
              "  public static final int NOTIF_ID = 4102;",
              "  public static final String ACTION_BROADCAST = \"com.blackpage.app.MUSIC_ACTION\";",
              "  private MediaSession mediaSession;",
              "",
              "  @Override",
              "  public void onCreate() {",
              "    super.onCreate();",
              "    mediaSession = new MediaSession(this, \"BlackpageMusic\");",
              "    mediaSession.setActive(true);",
              "    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {",
              "      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, \"Blackpage Music\", NotificationManager.IMPORTANCE_LOW);",
              "      ch.setShowBadge(false);",
              "      NotificationManager nm = getSystemService(NotificationManager.class);",
              "      if (nm != null) nm.createNotificationChannel(ch);",
              "    }",
              "  }",
              "",
              "  private PendingIntent actionIntent(String cmd, int reqCode) {",
              "    Intent i = new Intent(this, MusicService.class);",
              "    i.setAction(cmd);",
              "    int flags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;",
              "    return PendingIntent.getService(this, reqCode, i, flags);",
              "  }",
              "",
              "  @Override",
              "  public int onStartCommand(Intent intent, int flags, int startId) {",
              "    if (intent != null && intent.getAction() != null) {",
              "      String act = intent.getAction();",
              "      if (\"prev\".equals(act) || \"toggle\".equals(act) || \"next\".equals(act) || \"stop\".equals(act)) {",
              "        Intent b = new Intent(ACTION_BROADCAST);",
              "        b.setPackage(getPackageName());",
              "        b.putExtra(\"cmd\", act);",
              "        sendBroadcast(b);",
              "        if (\"stop\".equals(act)) {",
              "          stopForeground(true);",
              "          stopSelf();",
              "        }",
              "        return START_NOT_STICKY;",
              "      }",
              "    }",
              "    String title = intent != null && intent.getStringExtra(\"title\") != null ? intent.getStringExtra(\"title\") : \"Blackpage Music\";",
              "    String artist = intent != null && intent.getStringExtra(\"artist\") != null ? intent.getStringExtra(\"artist\") : \"Offline Audio\";",
              "    boolean isPlaying = intent == null || intent.getBooleanExtra(\"isPlaying\", true);",
              "    Intent openIntent = new Intent(this, MainActivity.class);",
              "    openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);",
              "    PendingIntent openPi = PendingIntent.getActivity(this, 10, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);",
              "    Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new Notification.Builder(this, CHANNEL_ID) : new Notification.Builder(this);",
              "    nb.setContentTitle(title)",
              "      .setContentText(artist)",
              "      .setSmallIcon(R.drawable.ic_stat_blackpage)",
              "      .setLargeIcon(BitmapFactory.decodeResource(getResources(), R.mipmap.ic_launcher))",
              "      .setContentIntent(openPi)",
              "      .setOngoing(isPlaying)",
              "      .setOnlyAlertOnce(true)",
              "      .addAction(new Notification.Action.Builder(android.R.drawable.ic_media_previous, \"Prev\", actionIntent(\"prev\", 1)).build())",
              "      .addAction(new Notification.Action.Builder(isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play, isPlaying ? \"Pause\" : \"Play\", actionIntent(\"toggle\", 2)).build())",
              "      .addAction(new Notification.Action.Builder(android.R.drawable.ic_media_next, \"Next\", actionIntent(\"next\", 3)).build())",
              "      .setStyle(new Notification.MediaStyle().setMediaSession(mediaSession.getSessionToken()).setShowActionsInCompactView(0, 1, 2));",
              "    Notification notif = nb.build();",
              "    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {",
              "      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);",
              "    } else {",
              "      startForeground(NOTIF_ID, notif);",
              "    }",
              "    return START_STICKY;",
              "  }",
              "",
              "  @Override",
              "  public void onDestroy() {",
              "    if (mediaSession != null) mediaSession.release();",
              "    super.onDestroy();",
              "  }",
              "",
              "  @Override",
              "  public IBinder onBind(Intent intent) { return null; }",
              "}",
              ""
            ].join("\n");
            fs.writeFileSync(svcPath, svcCode);

            // Add Android system bar + Music Foreground Service bridge
            const maPath = "android/app/src/main/java/com/blackpage/app/MainActivity.java";
            if (fs.existsSync(maPath)) {
              const maCode = [
                "package com.blackpage.app;",
                "",
                "import android.Manifest;",
                "import android.content.BroadcastReceiver;",
                "import android.content.Context;",
                "import android.content.Intent;",
                "import android.content.IntentFilter;",
                "import android.content.pm.PackageManager;",
                "import android.graphics.Color;",
                "import android.net.Uri;",
                "import android.os.Build;",
                "import android.os.Bundle;",
                "import android.os.PowerManager;",
                "import android.provider.Settings;",
                "import android.webkit.JavascriptInterface;",
                "import androidx.core.app.ActivityCompat;",
                "import androidx.core.content.ContextCompat;",
                "import androidx.core.view.WindowInsetsControllerCompat;",
                "import com.getcapacitor.BridgeActivity;",
                "",
                "public class MainActivity extends BridgeActivity {",
                "  private BroadcastReceiver musicReceiver;",
                "",
                "  @Override",
                "  protected void onCreate(Bundle savedInstanceState) {",
                "    super.onCreate(savedInstanceState);",
                "    if (this.bridge != null && this.bridge.getWebView() != null) {",
                "      this.bridge.getWebView().addJavascriptInterface(new Object() {",
                "        @JavascriptInterface",
                "        public void setSystemBarsDark(boolean isDark) {",
                "          runOnUiThread(() -> {",
                "            int bg = Color.parseColor(isDark ? \"#121214\" : \"#F2EDE2\");",
                "            getWindow().setStatusBarColor(bg);",
                "            getWindow().setNavigationBarColor(bg);",
                "            WindowInsetsControllerCompat ctrl = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());",
                "            ctrl.setAppearanceLightStatusBars(!isDark);",
                "            ctrl.setAppearanceLightNavigationBars(!isDark);",
                "          });",
                "        }",
                "",
                "        @JavascriptInterface",
                "        public boolean hasBackgroundMusicPermission() {",
                "          boolean notifOk = Build.VERSION.SDK_INT < 33 || ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED;",
                "          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);",
                "          boolean batteryOk = Build.VERSION.SDK_INT < 23 || pm == null || pm.isIgnoringBatteryOptimizations(getPackageName());",
                "          return notifOk && batteryOk;",
                "        }",
                "",
                "        @JavascriptInterface",
                "        public void requestBackgroundMusicPermission() {",
                "          runOnUiThread(() -> {",
                "            if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {",
                "              ActivityCompat.requestPermissions(MainActivity.this, new String[]{ Manifest.permission.POST_NOTIFICATIONS }, 4101);",
                "            }",
                "            if (Build.VERSION.SDK_INT >= 23) {",
                "              PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);",
                "              if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {",
                "                try {",
                "                  Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);",
                "                  i.setData(Uri.parse(\"package:\" + getPackageName()));",
                "                  startActivity(i);",
                "                } catch (Exception ignored) {}",
                "              }",
                "            }",
                "          });",
                "        }",
                "",
                "        @JavascriptInterface",
                "        public void startMusicNotification(String title, String artist, boolean isPlaying) {",
                "          Intent i = new Intent(MainActivity.this, MusicService.class);",
                "          i.putExtra(\"title\", title);",
                "          i.putExtra(\"artist\", artist);",
                "          i.putExtra(\"isPlaying\", isPlaying);",
                "          ContextCompat.startForegroundService(MainActivity.this, i);",
                "        }",
                "",
                "        @JavascriptInterface",
                "        public void stopMusicNotification() {",
                "          stopService(new Intent(MainActivity.this, MusicService.class));",
                "        }",
                "",
                "        @JavascriptInterface",
                "        public void moveToBackground() {",
                "          runOnUiThread(() -> moveTaskToBack(true));",
                "        }",
                "      }, \"BlackpageNative\");",
                "    }",
                "",
                "    musicReceiver = new BroadcastReceiver() {",
                "      @Override",
                "      public void onReceive(Context context, Intent intent) {",
                "        String cmd = intent.getStringExtra(\"cmd\");",
                "        if (cmd != null && bridge != null && bridge.getWebView() != null) {",
                "          bridge.getWebView().post(() -> bridge.getWebView().evaluateJavascript(\"window.__bpMusicAction && window.__bpMusicAction('\" + cmd + \"')\", null));",
                "        }",
                "      }",
                "    };",
                "    IntentFilter filter = new IntentFilter(MusicService.ACTION_BROADCAST);",
                "    if (Build.VERSION.SDK_INT >= 33) {",
                "      registerReceiver(musicReceiver, filter, Context.RECEIVER_NOT_EXPORTED);",
                "    } else {",
                "      registerReceiver(musicReceiver, filter);",
                "    }",
                "  }",
                "",
                "  @Override",
                "  public void onResume() {",
                "    super.onResume();",
                "    if (this.bridge != null && this.bridge.getWebView() != null) {",
                "      this.bridge.getWebView().post(() -> this.bridge.getWebView().evaluateJavascript(\"window.__bpMusicPermChanged && window.__bpMusicPermChanged()\", null));",
                "    }",
                "  }",
                "",
                "  @Override",
                "  public void onDestroy() {",
                "    if (musicReceiver != null) { try { unregisterReceiver(musicReceiver); } catch (Exception ignored) {} }",
                "    super.onDestroy();",
                "  }",
                "}",
                ""
              ].join("\n");
              fs.writeFileSync(maPath, maCode);
            }
          EOF

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackpage-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Blackpage.apk & Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Blackpage.apk

      - name: Release APK on GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Blackpage.apk
          generate_release_notes: true
