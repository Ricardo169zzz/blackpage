name: Build Blackpage APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Optional default API Base URL (e.g. https://your-server.com)"
        required: false
        type: string
        default: "https://blackpage-eta.vercel.app"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Inject API_BASE into index.html
        run: |
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("public/index.html", "utf8");
            const script = `<script>window.TOOLS_OP_API_BASE = ${JSON.stringify(process.env.API_BASE)};</script>`;
            html = html.replace("</head>", `  ${script}\n</head>`);
            fs.writeFileSync("public/index.html", html);
          '
        env:
          API_BASE: ${{ inputs.api_base || 'https://blackpage-eta.vercel.app' }}

      - name: Install Capacitor & Plugins
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/filesystem@6
          npm install --no-save @capacitor/assets @resvg/resvg-js

      - name: Generate Android App Icon & Splash from SVG
        run: |
          node -e '
            const fs = require("fs");
            const { Resvg } = require("@resvg/resvg-js");
            fs.mkdirSync("assets", { recursive: true });
            const svg = fs.readFileSync("public/icon.svg", "utf8");
            const iconPng = new Resvg(svg, { fitTo: { mode: "width", value: 1024 } }).render().asPng();
            fs.writeFileSync("assets/icon-only.png", iconPng);
            const fgSvg = svg.replace(/<rect[^>]*fill="#141414"[^>]*\/>/, "");
            fs.writeFileSync("assets/icon-foreground.png", new Resvg(fgSvg, { fitTo: { mode: "width", value: 1024 } }).render().asPng());
            const bgSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><rect width="1024" height="1024" fill="#141414"/></svg>`;
            fs.writeFileSync("assets/icon-background.png", new Resvg(bgSvg).render().asPng());
            const splashSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732"><rect width="2732" height="2732" fill="#141414"/><g transform="translate(854, 854) scale(1)">${svg.replace(/<\/?svg[^>]*>/g, "")}</g></svg>`;
            fs.writeFileSync("assets/splash.png", new Resvg(splashSvg, { fitTo: { mode: "width", value: 2732 } }).render().asPng());
          '

      - name: Generate Android Project & Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#141414" --splashBackgroundColor "#141414"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { Resvg } = require("@resvg/resvg-js");
            const svg = fs.readFileSync("public/icon.svg", "utf8");
            const fgSvg = svg.replace(/<rect[^>]*fill="#141414"[^>]*\/>/, "");
            const densities = [
              ["mipmap-mdpi", 48, 108],
              ["mipmap-hdpi", 72, 162],
              ["mipmap-xhdpi", 96, 216],
              ["mipmap-xxhdpi", 144, 324],
              ["mipmap-xxxhdpi", 192, 432]
            ];
            for (const [dir, iconSize, fgSize] of densities) {
              const outDir = path.join("android/app/src/main/res", dir);
              fs.mkdirSync(outDir, { recursive: true });
              const iconBuf = new Resvg(svg, { fitTo: { mode: "width", value: iconSize } }).render().asPng();
              const fgBuf = new Resvg(fgSvg, { fitTo: { mode: "width", value: fgSize } }).render().asPng();
              fs.writeFileSync(path.join(outDir, "ic_launcher.png"), iconBuf);
              fs.writeFileSync(path.join(outDir, "ic_launcher_round.png"), iconBuf);
              fs.writeFileSync(path.join(outDir, "ic_launcher_foreground.png"), fgBuf);
            }
            const bgXmlPath = "android/app/src/main/res/values/ic_launcher_background.xml";
            fs.mkdirSync(path.dirname(bgXmlPath), { recursive: true });
            fs.writeFileSync(bgXmlPath, `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#141414</color>\n</resources>\n`);
          '
          npx cap sync android

      - name: Patch AndroidManifest.xml permissions & cleartext
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace("<application", `<application android:usesCleartextTraffic="true"`);
            }
            const perms = [
              `<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />`,
              `<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />`,
              `<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />`,
              `<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />`
            ].filter(line => !xml.includes(line)).join("\n    ");
            if (perms) {
              xml = xml.replace("</manifest>", `    ${perms}\n</manifest>`);
            }
            fs.writeFileSync(p, xml);
          '

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackpage-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
