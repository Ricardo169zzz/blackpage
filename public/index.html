<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F1EA" />
  <title>Blackpage</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@500;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=49" />
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge">BP</span>
        <h1 class="brand-title">BLACKPAGE</h1>
      </div>
      <div class="status-pill" id="serverStatus" title="API Status">
        <span class="dot"></span>
        <span>ONLINE</span>
      </div>
    </header>

    <div class="workspace">
      <main class="tool-stage" id="toolStage"></main>
    </div>

    <nav class="tool-nav" aria-label="Daftar Tools" id="toolNav"></nav>
  </div>

  <script type="module" src="./app.js?v=49"></script>
</body>

</html>
